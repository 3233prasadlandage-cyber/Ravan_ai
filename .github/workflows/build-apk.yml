name: RAVAN AI - Build Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RAVAN_AI_WAKE_WORD_ADDED.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: ravan-ai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RAVAN_AI_WAKE_WORD_ADDED.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::RAVAN_AI_WAKE_WORD_ADDED.zip is missing from the repository root."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/ravan-ai-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -maxdepth 6 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts inside the ZIP."
            echo "ZIP contents (first 100 entries):"
            unzip -l "$ZIP_FILE" | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::The Android app module was not found beside the Gradle settings file."
            echo "Located project directory: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]]; then
            echo "::error::AndroidManifest.xml was not found in the app module."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project located at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Android SDK and accept licences
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android SDK 36 packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --console=plain --stacktrace -p "$PROJECT_DIR" clean assembleDebug

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"
          if ! compgen -G "$APK_DIR/*.apk" > /dev/null; then
            echo "::error::Gradle finished but no debug APK was found in $APK_DIR."
            exit 1
          fi
          ls -lh "$APK_DIR"/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: RAVAN-AI-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
